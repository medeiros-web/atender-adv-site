<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem conexão — Atender.adv</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0d14; --text: #f2f3f7; --text-dim: #a3a8bd; --accent-1: #8b5cf6; --accent-2: #3b82f6; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
    padding: 24px;
  }
  .mark {
    width: 64px; height: 64px;
    border-radius: 16px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.6rem; color: white;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { color: var(--text-dim); max-width: 360px; margin: 0 auto 24px; }
  button {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white; border: none; padding: 12px 24px; border-radius: 10px;
    font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
</style>
</head>
<body>
  <div>
    <div class="mark">A</div>
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar esta página agora. Verifique sua internet e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
